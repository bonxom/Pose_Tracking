services:
  expo:
    build:
      context: .
    working_dir: /app
    command: npm run web:docker
    environment:
      EXPO_NO_TELEMETRY: "1"
      WEB_HOST: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - pose_tracking_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  pose_tracking_node_modules:
